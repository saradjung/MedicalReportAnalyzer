{% extends 'base.html' %}

{% block title %}Upload Report - MedAnalyzer{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 p-8 bg-white shadow-lg rounded-lg">
    <h1 class="text-2xl font-semibold text-gray-800 mb-6">Upload a New Medical Report</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-4">
            <label for="report" class="block text-gray-700">Choose a file</label>
            {{ form.as_p }}
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md mt-4 hover:bg-blue-700">Upload</button>
    </form>
    <p class="mt-6 text-center"><a href="{% url 'dashboard' %}" class="text-blue-600 hover:text-blue-800">Back to Dashboard</a></p>
</div>
{% endblock %}
