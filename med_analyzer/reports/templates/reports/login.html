{% extends 'base.html' %}

{% block title %}Login - MedAnalyzer{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 p-8 bg-white shadow-lg rounded-lg">
    <h1 class="text-2xl font-semibold text-gray-800 mb-6">Login to Your Account</h1>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-4">
            <label for="username" class="block text-gray-700">Username</label>
            <input type="text" name="username" class="w-full px-4 py-2 border rounded-md mt-2" required>
        </div>
        <div class="mb-4">
            <label for="password" class="block text-gray-700">Password</label>
            <input type="password" name="password" class="w-full px-4 py-2 border rounded-md mt-2" required>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md mt-4 hover:bg-blue-700">Login</button>
    </form>
    <p class="mt-6 text-center">Don't have an account? <a href="{% url 'register' %}" class="text-blue-600 hover:text-blue-800">Register here</a></p>
</div>
{% endblock %}
