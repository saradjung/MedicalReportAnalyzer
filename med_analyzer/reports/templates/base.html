<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="min-h-screen flex flex-col">
        <!-- Navbar -->
        <nav class="bg-blue-600 p-4">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <a href="{% url 'dashboard' %}" class="text-white text-2xl font-semibold">MedAnalyzer</a>
                <div>
                    {% if user.is_authenticated %}
                        <span class="text-white">Hello, {{ user.username }}</span>
                        <a href="{% url 'logout' %}" class="ml-4 text-white hover:text-blue-200">Logout</a>
                    {% else %}
                        <a href="{% url 'login' %}" class="text-white hover:text-blue-200">Login</a>
                    {% endif %}
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="flex-1">
            {% block content %}{% endblock %}
        </div>

        <!-- Footer -->
        <footer class="bg-blue-600 p-4 mt-8 text-center text-white">
            <p>&copy; 2026 MedAnalyzer. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
